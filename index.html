<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Bier-Locator</title>
<meta name="description" content="Findet Kneipen, Biergärten, Brauereien & Getränkemärkte in der Nähe, vergleicht Bierpreise und plant gleichmäßige Fahrrad-Biertouren.">
<meta name="theme-color" content="#fbf4e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16110c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bier-Locator">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="styles.css">
<script>
  // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen)
  try {
    var raw = localStorage.getItem('bl_theme_v1');
    var t = raw ? JSON.parse(raw) : localStorage.getItem('bierlocator_theme_v1');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div id="map" aria-label="Karte"></div>

<header class="topbar">
  <button class="brand" id="btnBrand" aria-label="Bier-Locator — Info">
    <span class="brand-glass" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="30" height="30"><defs><clipPath id="glassClip"><path d="M8 7h14l-1.6 19a2.2 2.2 0 0 1-2.2 2h-6.4a2.2 2.2 0 0 1-2.2-2z"/></clipPath></defs>
        <g clip-path="url(#glassClip)"><rect class="bg-beer" x="0" y="11" width="32" height="22"/><circle class="bubble b1" cx="12" cy="24" r="1"/><circle class="bubble b2" cx="17" cy="26" r="0.8"/><circle class="bubble b3" cx="15" cy="22" r="0.7"/></g>
        <path class="bg-foam" d="M7 9.5a3 3 0 0 1 3.4-3 3.6 3.6 0 0 1 6.2-.6 3 3 0 0 1 5.6 1.6v2.2H7z"/>
        <path d="M8 7h14l-1.6 19a2.2 2.2 0 0 1-2.2 2h-6.4a2.2 2.2 0 0 1-2.2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M22 11h2.2a2.3 2.3 0 0 1 2.3 2.3v3.4a2.3 2.3 0 0 1-2.3 2.3h-2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </span>
    <span class="brand-text">Bier&shy;Locator</span>
  </button>
  <div class="searchbox" id="searchBox">
    <span class="searchbox-icon" data-icon="search" data-icon-size="18"></span>
    <input id="searchInput" type="search" placeholder="Ort, Adresse, Lokal…" autocomplete="off" aria-label="Ort suchen" aria-controls="searchSuggest" aria-autocomplete="list">
    <button id="searchClear" class="icon-btn small" aria-label="Suche leeren" hidden><span data-icon="x" data-icon-size="16"></span></button>
    <ul id="searchSuggest" class="suggest" role="listbox" hidden></ul>
  </div>
  <button id="btnLocate" class="fab" aria-label="Meinen Standort verwenden" title="Mein Standort"><span data-icon="locate" data-icon-size="20"></span></button>
  <div class="menu-wrap">
    <button id="btnMenu" class="fab" aria-label="Menü" aria-haspopup="true" aria-expanded="false"><span data-icon="menu" data-icon-size="20"></span></button>
    <div id="menu" class="menu" role="menu" hidden>
      <button role="menuitem" data-action="bac"><span data-icon="calculator" data-icon-size="17"></span>Promille-Rechner</button>
      <button role="menuitem" data-action="theme"><span id="themeIcon" data-icon="moon" data-icon-size="17"></span><span id="themeLabel">Dunkles Design</span></button>
      <button role="menuitem" data-action="export"><span data-icon="download" data-icon-size="17"></span>Daten exportieren</button>
      <button role="menuitem" data-action="import"><span data-icon="upload" data-icon-size="17"></span>Daten importieren</button>
      <button role="menuitem" data-action="about"><span data-icon="info" data-icon-size="17"></span>Über die App</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</header>

<button id="btnSearchArea" class="area-pill" hidden><span data-icon="refresh" data-icon-size="15"></span>In diesem Bereich suchen</button>

<aside id="sheet" class="sheet" aria-label="Orte und Touren">
  <div class="sheet-grab" id="sheetGrab">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <div class="loc-row">
        <span class="loc-pin" data-icon="pin" data-icon-size="16"></span>
        <span id="locLabel" class="loc-label">Kein Standort gewählt</span>
        <span id="weatherChip" class="weather-chip" hidden></span>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" aria-selected="true" data-mode="find" id="tabFind"><span data-icon="beerMug" data-icon-size="17"></span>Bier finden</button>
        <button class="tab" role="tab" aria-selected="false" data-mode="tour" id="tabTour"><span data-icon="bike" data-icon-size="17"></span>Bier-Radtour</button>
        <span class="tab-indicator" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <div class="sheet-body" id="sheetBody">
    <!-- ===== Bier finden ===== -->
    <section id="paneFind" class="pane" role="tabpanel" aria-labelledby="tabFind">
      <div class="chips-scroll" id="typeChips" aria-label="Ortstypen"></div>
      <div class="toolbar">
        <button class="toggle-chip" id="fOpen" aria-pressed="false"><span class="dot-open"></span>Jetzt offen</button>
        <button class="toggle-chip" id="fPrice" aria-pressed="false"><span data-icon="coin" data-icon-size="14"></span>Mit Preis</button>
        <button class="toggle-chip" id="fFav" aria-pressed="false"><span data-icon="heart" data-icon-size="14"></span>Favoriten</button>
        <label class="sort-select"><span class="sr-only">Sortierung</span>
          <select id="sortSelect">
            <option value="recommended">Für dich</option>
            <option value="distance">Nächste</option>
            <option value="price">Günstigste</option>
            <option value="rating">Beste</option>
          </select>
        </label>
      </div>

      <details class="prefs" id="prefsBox">
        <summary><span data-icon="sliders" data-icon-size="16"></span>Umkreis &amp; Vorlieben <span class="prefs-summary" id="prefsSummary"></span><span class="chev" data-icon="chevronDown" data-icon-size="16"></span></summary>
        <div class="prefs-body">
          <label class="field">
            <span class="field-label">Suchradius <b id="radiusValue">1,0 km</b></span>
            <input id="radius" type="range" min="300" max="5000" step="100" value="1000" class="range">
          </label>
          <div class="field-row">
            <label class="field">
              <span class="field-label">Lieblingssorte</span>
              <input id="prefBeer" type="text" list="beerList" placeholder="z.B. Zwickl" maxlength="40">
            </label>
            <label class="field">
              <span class="field-label">Max. Preis / 0,5 l</span>
              <input id="prefMaxPrice" type="number" inputmode="decimal" min="0" step="0.1" placeholder="4,50">
            </label>
          </div>
          <label class="field">
            <span class="field-label">Nur Orte mit Sorte…</span>
            <input id="filterBeer" type="text" list="beerList" placeholder="filtert nach gemeldeten Preisen">
          </label>
          <label class="switch-row">
            <input id="prefBiergarten" type="checkbox" class="switch">
            <span>Biergärten bevorzugen <small>(bei schönem Wetter ohnehin)</small></span>
          </label>
        </div>
      </details>

      <div id="cheapestCard" class="cheapest" hidden></div>

      <div class="results-head">
        <h2><span id="resultCount">0</span> <span id="resultNoun">Orte</span></h2>
        <button id="btnUnhide" class="link-btn" hidden></button>
      </div>
      <div id="results" class="results" aria-live="polite"></div>
    </section>

    <!-- ===== Bier-Radtour ===== -->
    <section id="paneTour" class="pane" role="tabpanel" aria-labelledby="tabTour" hidden>
      <div class="tour-form" id="tourForm">
        <div class="segmented" id="tourMode" role="radiogroup" aria-label="Tourart">
          <button role="radio" data-value="round" aria-checked="true">Rundtour</button>
          <button role="radio" data-value="ab" aria-checked="false">Von A nach B</button>
        </div>
        <div id="tourDestWrap" class="searchbox inline" hidden>
          <span class="searchbox-icon" data-icon="flag" data-icon-size="17"></span>
          <input id="tourDest" type="search" placeholder="Ziel eingeben…" autocomplete="off" aria-label="Ziel">
          <ul id="tourDestSuggest" class="suggest" role="listbox" hidden></ul>
        </div>

        <label class="field">
          <span class="field-label">Länge <b id="tourKmValue">15 km</b></span>
          <input id="tourKm" type="range" min="4" max="80" step="1" value="15" class="range">
        </label>

        <div class="field-row">
          <div class="field">
            <span class="field-label">Bierstopps</span>
            <div class="stepper" id="tourStops">
              <button type="button" data-step="-1" aria-label="Weniger Stopps"><span data-icon="minus" data-icon-size="16"></span></button>
              <output id="tourStopsValue">4</output>
              <button type="button" data-step="1" aria-label="Mehr Stopps"><span data-icon="plus" data-icon-size="16"></span></button>
            </div>
          </div>
          <label class="field">
            <span class="field-label">Start</span>
            <input id="tourStart" type="time" step="900">
          </label>
          <label class="field">
            <span class="field-label">Pause/Stopp</span>
            <select id="tourDwell">
              <option value="15">15 Min</option>
              <option value="30" selected>30 Min</option>
              <option value="45">45 Min</option>
              <option value="60">1 Std</option>
              <option value="90">1,5 Std</option>
            </select>
          </label>
        </div>

        <div class="field">
          <span class="field-label">Fahrstil</span>
          <div class="style-cards" id="tourStyle" role="radiogroup" aria-label="Fahrstil"></div>
        </div>

        <label class="switch-row">
          <input id="tourShops" type="checkbox" class="switch">
          <span>Auch Restaurants, Läden &amp; Tankstellen <small>(sonst nur Kneipen, Gasthäuser, Biergärten, Brauereien)</small></span>
        </label>

        <button id="btnPlan" class="btn btn-primary btn-big"><span data-icon="route" data-icon-size="19"></span>Tour planen</button>
        <p class="fine">Plant gleichmäßig verteilte Stopps, die zur geschätzten Ankunftszeit geöffnet haben.</p>
      </div>

      <div id="tourProgress" class="tour-progress" hidden>
        <div class="ride-track"><span class="ride-bike" data-icon="bike" data-icon-size="28"></span></div>
        <div id="tourProgressText" class="tour-progress-text">Form wird gesucht…</div>
      </div>
      <div id="tourError" class="notice notice-bad" hidden></div>

      <div id="tourResult" class="tour-result" hidden>
        <div class="tour-result-head">
          <h2 id="tourTitle">Deine Biertour</h2>
          <button id="btnTourEdit" class="link-btn"><span data-icon="sliders" data-icon-size="14"></span>Anpassen</button>
        </div>
        <div id="tourStats" class="stat-grid"></div>
        <div id="tourWeather"></div>
        <div id="tourHints"></div>
        <div id="tourElev" class="elev"></div>
        <ol id="tourTimeline" class="timeline"></ol>
        <div class="action-grid">
          <button id="btnReroll" class="btn btn-soft"><span data-icon="shuffle" data-icon-size="17"></span>Andere Route</button>
          <button id="btnShareTour" class="btn btn-soft"><span data-icon="share" data-icon-size="17"></span>Teilen</button>
          <button id="btnGpx" class="btn btn-soft"><span data-icon="download" data-icon-size="17"></span>GPX</button>
          <button id="btnGmaps" class="btn btn-soft"><span data-icon="compass" data-icon-size="17"></span>Google Maps</button>
        </div>
      </div>
    </section>
  </div>
</aside>

<datalist id="beerList"></datalist>

<dialog id="placeDialog" class="dlg" aria-labelledby="placeTitle">
  <button class="dlg-close icon-btn" data-close aria-label="Schließen"><span data-icon="x" data-icon-size="18"></span></button>
  <div id="placeBody"></div>
</dialog>

<dialog id="bacDialog" class="dlg dlg-wide" aria-labelledby="bacTitle">
  <button class="dlg-close icon-btn" data-close aria-label="Schließen"><span data-icon="x" data-icon-size="18"></span></button>
  <div id="bacBody"></div>
</dialog>

<dialog id="aboutDialog" class="dlg" aria-labelledby="aboutTitle">
  <button class="dlg-close icon-btn" data-close aria-label="Schließen"><span data-icon="x" data-icon-size="18"></span></button>
  <div id="aboutBody"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
